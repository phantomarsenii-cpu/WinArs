plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    // namespace = пакет R/BuildConfig. Код Winlator живёт в com.winlator и ссылается на com.winlator.R.
    // applicationId (то, что видит Android и что стоит в /data/data/...) — com.winars.app.
    namespace 'com.winlator'
    compileSdk 35
    ndkVersion '24.0.8215888'          // как в оригинальном Winlator 11.2

    defaultConfig {
        applicationId "com.winars.app"
        minSdk 26
        // targetSdk 28 обязателен: с 29 Android запрещает exec файлов из /data/data/.../files (box64, wine)
        targetSdk 28
        versionCode (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
        versionName "1.0-core-11.2"
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    // libwinlator, libvortekrenderer, libgladiorenderer, libvirglrenderer, libmidihandler, libadrenotools
    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            '-opt-in=androidx.compose.material3.ExperimentalMaterial3Api',
            '-opt-in=androidx.compose.foundation.ExperimentalFoundationApi'
        ]
    }
    buildFeatures { compose true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.14' }

    packaging {
        jniLibs { useLegacyPackaging = true }   // pulseaudio и др. запускаются как исполняемые файлы из nativeLibraryDir
        resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' }
    }
    // assets не сжимать: .tzst уже сжаты, а Winlator читает их потоком
    androidResources { noCompress += ['tzst', 'json'] }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // --- Winlator 11.2 (версии как в оригинальном build.gradle) ---
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.20'
    implementation 'androidx.lifecycle:lifecycle-process:2.5.1'

    // --- оболочка WinArs ---
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.0'
    implementation 'androidx.savedstate:savedstate:1.2.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'io.coil-kt:coil-compose:2.6.0'
}
